version: 2

updates:
  # Runtime and dev dependencies in pyproject.toml / uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      # Minor/patch runtime bumps are grouped; a major bump of nvidia-ml-py or
      # prometheus-client arrives as its own PR.
      runtime:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      dev-tools:
        dependency-type: "development"
    open-pull-requests-limit: 5

  # Actions used by .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns: ["*"]
