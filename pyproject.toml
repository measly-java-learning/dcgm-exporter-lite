[project]
name = "dcgm-exporter-lite"
version = "0.1.0"
description = "Unprivileged Prometheus exporter for NVIDIA GPU metrics with DCGM Exporter 4.9.0-compatible names"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "Corey Cole", email = "3700879+corey-cole@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
  "nvidia-ml-py==13.615.71",
  "prometheus-client==0.26.0",
]

[project.scripts]
dcgm-exporter-lite = "dcgm_exporter_lite:main"

[project.urls]
Homepage = "https://github.com/corey-cole/dcgm-exporter-lite"
Issues = "https://github.com/corey-cole/dcgm-exporter-lite/issues"
Source = "https://github.com/corey-cole/dcgm-exporter-lite"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
markers = ["hardware: needs a real NVIDIA GPU"]
addopts = "-m 'not hardware'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
