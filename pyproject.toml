[project]
name = "dcgm-exporter-lite"
dynamic = ["version"]
description = "Unprivileged Prometheus exporter for NVIDIA GPU metrics with DCGM Exporter 4.9.0-compatible names"
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    { name = "Corey Cole", email = "3700879+corey-cole@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dependencies = [
  "nvidia-ml-py==13.615.71",
  "prometheus-client==0.26.0",
]

[project.scripts]
dcgm-exporter-lite = "dcgm_exporter_lite:main"

[project.urls]
Homepage = "https://github.com/measly-java-learning/dcgm-exporter-lite"
Issues = "https://github.com/measly-java-learning/dcgm-exporter-lite/issues"
Source = "https://github.com/measly-java-learning/dcgm-exporter-lite"

[build-system]
# uv_build has no dynamic versions; hatch-vcs derives the version from git tags.
requires = ["hatchling>=1.27", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/dcgm_exporter_lite"]

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE", "LICENSES"]

[dependency-groups]
dev = [
  "pytest-cov>=7.1.0",
  "ruff==0.17.4",
]

[tool.pytest.ini_options]
markers = ["hardware: needs a real NVIDIA GPU"]
addopts = "-m 'not hardware'"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
